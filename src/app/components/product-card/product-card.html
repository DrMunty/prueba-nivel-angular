<div class = "gallery">
<ul>
    <div class="gallery-item">
    @for (product of productList.myProductList(); track product.id){
        <a class ="product-title" [routerLink]="['/details', product.id]"> {{product.title}}</a>
        <a class="product-price"> {{product.price}}$</a>
        <img class ="product-image"[src]="product.image">
        
    }
    </div>
</ul>

</div>
